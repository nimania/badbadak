<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="بادبادک؛ پنجره‌ای به خبرهای چهره‌ها، سبک زندگی، سرگرمی و اتفاق‌های روز ایران">
  <link rel="canonical" href="https://pendar.io/badbadak/">
  <link rel="icon" href="./assets/badbadak-logo.png">
  <title>بادبادک | چهره‌ها، سبک زندگی و سرگرمی</title>
  <style>
    :root { color-scheme: light dark; --ink:#242321; --ink-soft:#6d6b66; --surface:#fff; --surface-2:#f6f4ee; --line-strong:#b9b6ae; font-family:Vazirmatn,Tahoma,sans-serif; background:#efeee9; color:var(--ink); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--surface-2); }
    .site-top { min-height:44px; padding:8px max(16px,calc((100vw - 960px)/2)); display:flex; align-items:center; justify-content:space-between; gap:16px; background:#fff; border-bottom:1px solid #dedbd3; font-size:.82rem; }
    .site-top a { color:inherit; text-decoration:none; }
    .site-top .brand { font-weight:800; }
    #badbadak-view { --ink:#242321; --ink-soft:#6d6b66; --surface:#fff; --surface-2:#f6f4ee; --line-strong:#b9b6ae; }
    footer { max-width:960px; margin:0 auto; padding:12px 16px 28px; color:#77736b; font-size:.78rem; }
    @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --ink:#eeeae1; --ink-soft:#aaa69d; --surface:#1d1c1a; --surface-2:#111; --line-strong:#504d47; background:#111; color:var(--ink); } :root:not([data-theme="light"]) .site-top { background:#1d1c1a;border-color:#383631; } }
  </style>
  <link rel="stylesheet" href="./badbadak.css">
</head>
<body>
  <div class="site-top"><a class="brand" href="https://pendar.io/">پندار</a><a href="https://pendar.io/">بازگشت به پندار ↗</a></div>
  <main id="badbadak-view"><div id="badbadak-content" aria-live="polite"></div></main>
  <footer>بادبادک؛ پروژه‌ای مستقل از پندار · پیوند هر خبر به منبع اصلی آن</footer>
  <script src="./runtime.js"></script>
  <script src="./badbadak.js"></script>
  <script>
    if (location.hash.includes('crossword')) showBadbadakCrossword();
    else showBadbadak();
    window.addEventListener('hashchange', () => {
      if (location.hash.includes('crossword')) showBadbadakCrossword();
      else if (_bbPage !== 'home') showBadbadak();
    });
  </script>
</body>
</html>
