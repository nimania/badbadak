name: Publish Badbadak
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install article parser
        run: pip install beautifulsoup4
      - name: Retrieve full articles and verify source links
        run: python scripts/build_articles.py
      - name: Build published WordPress posts (safe cutover)
        if: ${{ vars.BADBADAK_WP_API_URL != '' }}
        env:
          BADBADAK_WP_API_URL: ${{ vars.BADBADAK_WP_API_URL }}
        run: python scripts/build_from_wordpress.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
