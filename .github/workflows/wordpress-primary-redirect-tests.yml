name: Verify WordPress primary migration
on:
  pull_request:
    paths:
      - 'scripts/redirect_legacy.py'
      - 'tests/test_redirect_legacy.py'
      - 'data/wordpress-redirect-map.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/refresh-feeds.yml'
      - '.github/workflows/wordpress-primary-redirect-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate redirect configuration
        run: python -m json.tool data/wordpress-redirect-map.json >/dev/null
      - name: Validate redirect builder syntax
        run: python -m py_compile scripts/redirect_legacy.py
      - name: Run redirect migration tests
        run: python -m unittest discover -s tests -p 'test_redirect_legacy.py' -v
