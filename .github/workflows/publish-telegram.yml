name: Publish Badbadak to Telegram
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: badbadak-telegram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish new articles
        env:
          NESHANIKERMAN_BOT_TOKEN: ${{ secrets.NESHANIKERMAN_BOT_TOKEN }}
        run: python scripts/publish_telegram.py
      - name: Save publication history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/telegram-published.json
          if ! git diff --cached --quiet; then
            git commit -m 'Track Badbadak Telegram posts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
